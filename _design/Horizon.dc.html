<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&amp;family=Jost:wght@300;400;500&amp;display=swap">
  <style>
    body { margin: 0; background: #1E1D1B; -webkit-font-smoothing: antialiased; }
    a { color: #F4EFE7; text-decoration: none; } a:hover { color: #E57A3C; }
  </style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; overflow: hidden; background: #6F6A63 url(./ocean-wide.jpg) center / cover no-repeat; color: #F4EFE7; font-family: 'Jost', 'Helvetica Neue', Arial, sans-serif; font-weight: 300;">

  <div style="position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(30, 29, 27, 0.26) 0%, rgba(30, 29, 27, 0) 22%, rgba(30, 29, 27, 0) 40%, rgba(30, 29, 27, 0.5) 100%), linear-gradient(to right, rgba(30, 29, 27, 0.3) 0%, rgba(30, 29, 27, 0) 60%);"></div>

  <div style="position: relative; height: 100%; box-sizing: border-box; padding: 40px 64px 36px; display: flex; flex-direction: column; justify-content: space-between;">

    <header style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: center;">
      <span style="font-size: 11px; font-weight: 400; letter-spacing: 0.32em; text-transform: uppercase;">Modern energy</span>
      <span style="justify-self: center; font-family: 'Cormorant Garamond', Garamond, 'Times New Roman', serif; font-weight: 500; font-size: 44px; line-height: 1; letter-spacing: -0.01em;">diem</span>
      <span style="justify-self: end; font-size: 11px; font-weight: 400; letter-spacing: 0.32em; text-transform: uppercase;">Science · Ritual</span>
    </header>

    <div style="display: flex; flex-direction: column; gap: 30px; width: 700px; padding-bottom: 8px;">
      <h1 style="margin: 0; font-family: 'Cormorant Garamond', Garamond, 'Times New Roman', serif; font-weight: 400; font-size: 124px; line-height: 0.92; letter-spacing: -0.02em; text-shadow: 0 1px 24px rgba(30, 29, 27, 0.18);">Energy for a <em style="font-style: italic;">brighter</em> you.</h1>

      <div style="display: flex; flex-direction: column; gap: 20px; width: 480px;">
        <p style="margin: 0; font-size: 19px; line-height: 1.55; letter-spacing: 0.015em; color: rgba(244, 239, 231, 0.92);">Clean, sustained energy without the usual trade-offs.</p>
        <div style="display: flex; height: 56px;">
          <div style="flex: 1; display: flex; align-items: center; padding: 0 20px; background: rgba(244, 239, 231, 0.95); font-size: 15px; font-weight: 400; letter-spacing: 0.02em; color: #8A857E;">Email address</div>
          <div style="display: flex; align-items: center; padding: 0 26px; background: #1E1D1B; color: #F4EFE7; font-size: 12px; font-weight: 500; letter-spacing: 0.22em; text-transform: uppercase;">Notify me</div>
        </div>
        <p style="margin: 0; font-size: 11px; font-weight: 400; letter-spacing: 0.26em; text-transform: uppercase; color: rgba(244, 239, 231, 0.75);">Launching soon. Be first to know.</p>
      </div>
    </div>

    <footer style="display: flex; justify-content: space-between; align-items: center; padding-top: 24px; border-top: 1px solid rgba(244, 239, 231, 0.28); font-size: 11px; font-weight: 400; letter-spacing: 0.24em; text-transform: uppercase; color: rgba(244, 239, 231, 0.75);">
      <span>© 2026 diem</span>
      <span>drinkdiem.com</span>
    </footer>

  </div>
</div>
</x-dc>
</body>
</html>
