<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&amp;family=Jost:wght@300;400;500&amp;display=swap">
  <style>
    body { margin: 0; background: #F4EFE7; -webkit-font-smoothing: antialiased; }
    a { color: #1E1D1B; text-decoration: none; } a:hover { color: #E57A3C; }
  </style>
</helmet>
<div style="width: 390px; min-height: 1200px; box-sizing: border-box; padding: 0 20px; background: #F4EFE7; color: #1E1D1B; font-family: 'Jost', 'Helvetica Neue', Arial, sans-serif; font-weight: 300; display: flex; flex-direction: column;">

  <header style="height: 68px; flex: none; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(30, 29, 27, 0.14);">
    <div style="display: flex; align-items: center; gap: 10px;">
      <svg width="32" height="15" viewBox="0 0 120 56" aria-hidden="true">
        <defs>
          <linearGradient id="silver-m" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#E6E3DE"></stop>
            <stop offset="0.5" stop-color="#A9A59E"></stop>
            <stop offset="1" stop-color="#5E5A55"></stop>
          </linearGradient>
        </defs>
        <path d="M30 40a30 30 0 0 1 60 0z" fill="url(#silver-m)"></path>
        <path d="M2 44 Q60 41.6 118 44 Q60 46.4 2 44z" fill="#1E1D1B"></path>
      </svg>
      <span style="font-family: 'Cormorant Garamond', Garamond, 'Times New Roman', serif; font-weight: 500; font-size: 27px; line-height: 1; letter-spacing: -0.01em;">diem</span>
    </div>
    <span style="font-size: 10px; font-weight: 400; letter-spacing: 0.28em; text-transform: uppercase; color: #4F4B46;">Modern energy</span>
  </header>

  <main style="display: flex; flex-direction: column; padding-top: 52px;">
    <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 24px;">
      <span style="width: 7px; height: 7px; border-radius: 50%; background: #E57A3C;"></span>
      <span style="font-size: 10px; font-weight: 400; letter-spacing: 0.3em; text-transform: uppercase; color: #4F4B46;">Introducing diem</span>
    </div>

    <h1 style="margin: 0; font-family: 'Cormorant Garamond', Garamond, 'Times New Roman', serif; font-weight: 400; font-size: 60px; line-height: 0.96; letter-spacing: -0.02em;">Energy for a <em style="font-style: italic;">brighter</em> you.</h1>

    <span style="display: block; width: 36px; height: 1px; background: #E57A3C; margin: 30px 0 20px;"></span>

    <p style="margin: 0; max-width: 310px; font-size: 17px; line-height: 1.55; letter-spacing: 0.015em; color: #4F4B46;">Clean, sustained energy without the usual trade-offs.</p>

    <div style="display: flex; height: 54px; margin-top: 32px;">
      <div style="flex: 1; min-width: 0; display: flex; align-items: center; padding: 0 16px; background: #FAF7F2; border: 1px solid #D9D3C9; border-right: 0; font-size: 15px; font-weight: 400; letter-spacing: 0.02em; color: #8A857E;">Email address</div>
      <div style="display: flex; align-items: center; padding: 0 18px; background: #1E1D1B; color: #F4EFE7; font-size: 11px; font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase;">Notify me</div>
    </div>

    <p style="margin: 16px 0 0; font-size: 10px; font-weight: 400; letter-spacing: 0.24em; text-transform: uppercase; color: #8A857E;">Launching soon. Be first to know.</p>
  </main>

  <div style="position: relative; margin-top: 56px; margin-bottom: 64px;">
    <div style="position: relative; height: 438px; background: #E6E0D6 url(./ocean.jpg) 32% 38% / cover no-repeat;">
      <div style="position: absolute; top: 24px; left: 24px; display: flex; flex-direction: column; gap: 14px;">
        <span style="font-size: 11px; font-weight: 400; line-height: 2; letter-spacing: 0.32em; text-transform: uppercase; color: #1E1D1B; white-space: pre-line;">More
of what
matters</span>
        <span style="width: 22px; height: 1px; background: #1E1D1B;"></span>
      </div>
    </div>
    <div style="position: absolute; right: 18px; bottom: -44px; width: 132px; height: 165px; border: 8px solid #F4EFE7; background: #D9CFC2 url(./portrait.jpg) 62% 30% / cover no-repeat;"></div>
  </div>

  <footer style="display: flex; flex-direction: column; gap: 14px; padding: 24px 0 32px; border-top: 1px solid rgba(30, 29, 27, 0.14); font-size: 10px; font-weight: 400; letter-spacing: 0.24em; text-transform: uppercase; color: #8A857E;">
    <span>Science · Ritual · A brighter tomorrow</span>
    <div style="display: flex; justify-content: space-between;">
      <span>© 2026 diem</span>
      <span>drinkdiem.com</span>
    </div>
  </footer>

</div>
</x-dc>
</body>
</html>
